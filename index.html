<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
    <title>Inventory P&L</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== Dark theme (default, applies to <html>) ===== */
        :root {
            --accent: #e76f30;            /* brighter terracotta for dark bg */
            --accent-dark: #f08a4d;
            --accent-soft: rgba(231, 111, 48, 0.10);
            --accent-ring: rgba(231, 111, 48, 0.30);

            --ink: #f0f3f5;               /* light headings on dark */
            --text: #a8b0b8;
            --text-light: #6c757d;

            --bg: #0d1117;                 /* GitHub dark bg */
            --card-bg: #161b22;            /* card surface */
            --topbar-bg: #010409;          /* near-black top bar */
            --topbar-fg: #f0f3f5;

            --line: #21262d;
            --line-strong: #30363d;
            --input-bg: #0d1117;

            --radius: 0px;
            --shadow-card: 0 1px 0 rgba(255,255,255,0.02) inset, 0 8px 24px rgba(0,0,0,0.35);
        }

        /* When user explicitly picks light (applied to <html>) */
        :root[data-theme="light"] {
            --accent: #b8520a;
            --accent-dark: #8f3f08;
            --accent-soft: #fbf2eb;
            --accent-ring: rgba(184, 82, 10, 0.18);
            --ink: #212529;
            --text: #666666;
            --text-light: #999999;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --topbar-bg: #212529;
            --topbar-fg: #ffffff;
            --line: #e9ecef;
            --line-strong: #dee2e6;
            --input-bg: #ffffff;
            --shadow-card: none;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html { background: var(--bg); transition: background-color 0.2s ease; }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            font-size: 15px;
            line-height: 1.5;
            /* Safe-area on notched phones */
            padding-bottom: env(safe-area-inset-bottom);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* ===== Top bar ===== */
        .topbar {
            background: var(--topbar-bg);
            color: var(--topbar-fg);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 10;
            padding-top: max(14px, env(safe-area-inset-top));
        }
        .topbar .inner {
            max-width: 480px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .brand {
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 0.4px;
            color: var(--topbar-fg);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand .dot {
            width: 8px; height: 8px; background: var(--accent); display: inline-block;
        }
        .brand small {
            color: rgba(255,255,255,0.55);
            font-weight: 400;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-left: 4px;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .topbar .meta {
            font-size: 11px;
            color: rgba(255,255,255,0.55);
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        /* Theme toggle button */
        .theme-toggle {
            width: 32px; height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--topbar-fg);
            cursor: pointer;
            border-radius: 0;
            padding: 0;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.14); }
        .theme-toggle:active { transform: translateY(1px); }
        .theme-toggle svg { width: 16px; height: 16px; display: block; }
        .theme-toggle .icon-sun { display: none; }
        :root[data-theme="light"] .theme-toggle .icon-sun { display: block; }
        :root[data-theme="light"] .theme-toggle .icon-moon { display: none; }

        /* ===== Main container ===== */
        main {
            flex: 1;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 32px 20px 48px;
            padding-left: max(20px, env(safe-area-inset-left));
            padding-right: max(20px, env(safe-area-inset-right));
        }

        /* ===== Page title ===== */
        .page-head {
            text-align: center;
            margin-bottom: 28px;
        }
        .page-head .eyebrow {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 8px;
        }
        .page-head h1 {
            font-size: 28px;
            font-weight: 900;
            color: var(--ink);
            letter-spacing: -0.4px;
            line-height: 1.15;
        }
        .page-head p {
            margin-top: 8px;
            font-size: 13px;
            color: var(--text);
        }

        /* ===== Section card ===== */
        .section {
            background: var(--card-bg);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 24px 22px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-card);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .section.active {
            border-color: var(--line-strong);
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line);
            gap: 8px;
        }
        .section-head h2 {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-head h2::before {
            content: "";
            width: 14px; height: 2px;
            background: var(--accent);
            display: inline-block;
            flex-shrink: 0;
        }
        .section-head .step {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-light);
            letter-spacing: 1px;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .section.active .section-head .step { color: var(--accent); }

        .status-dot {
            display: inline-block;
            width: 6px; height: 6px;
            background: var(--line-strong);
            margin-left: 6px;
            border-radius: 50%;
        }
        .section.active .status-dot { background: var(--accent); }

        /* ===== Inputs ===== */
        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .input-row.full-width { grid-template-columns: 1fr; }

        .input-group { display: flex; flex-direction: column; }
        .input-group label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 6px;
        }

        .input-wrapper { position: relative; }

        input {
            width: 100%;
            padding: 12px 12px;
            font-size: 16px;           /* 16px prevents iOS zoom-on-focus */
            font-weight: 500;
            color: var(--ink);
            background: var(--input-bg);
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            -moz-appearance: textfield;
            appearance: textfield;
        }
        input::-webkit-outer-spinbutton,
        input::-webkit-inner-spinbutton { -webkit-appearance: none; margin: 0; }
        input::placeholder { color: var(--text-light); font-weight: 400; }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-ring);
        }

        input.derived {
            background-color: var(--bg);
            color: var(--ink);
        }

        input[readonly] {
            background-color: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent-dark);
            font-weight: 800;
            cursor: default;
        }

        .suffix {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            font-weight: 700;
            color: var(--text-light);
            pointer-events: none;
            letter-spacing: 0.5px;
        }

        .disabled-section {
            opacity: 0.55;
            pointer-events: none;
            filter: grayscale(0.4);
        }
        .disabled-section .section-head h2::before { background: var(--line-strong); }

        /* ===== Footer ===== */
        footer {
            background: var(--topbar-bg);
            color: rgba(255,255,255,0.55);
            padding: 18px 20px;
            text-align: center;
            font-size: 12px;
            letter-spacing: 0.4px;
        }
        footer .accent-bar {
            height: 2px;
            background: var(--accent);
            margin: 0 auto 14px;
            width: 40px;
        }

        /* ===== Mobile breakpoint ===== */
        @media (max-width: 480px) {
            main {
                padding: 24px 16px 36px;
                padding-left: max(16px, env(safe-area-inset-left));
                padding-right: max(16px, env(safe-area-inset-right));
            }
            .section { padding: 20px 16px; margin-bottom: 16px; }
            .page-head { margin-bottom: 22px; }
            .page-head h1 { font-size: 22px; }
            .page-head p { font-size: 12.5px; }
            .input-row {
                grid-template-columns: 1fr;   /* single column on phones */
                gap: 12px;
            }
            input {
                font-size: 16px;              /* keep 16px — iOS zoom prevention */
                padding: 14px 12px;           /* taller touch target */
            }
            .topbar .inner { padding: 0 16px; }
            .brand { font-size: 15px; }
            .brand small { display: none; }   /* hide sub-label on tight screens */
            .topbar .meta { display: none; }
        }

        /* ===== Very small phones (≤360px, e.g. iPhone SE 1st gen, small Androids) ===== */
        @media (max-width: 360px) {
            main { padding: 18px 12px 28px; }
            .section { padding: 16px 12px; }
            .page-head h1 { font-size: 20px; }
            .section-head { flex-direction: column; align-items: flex-start; gap: 4px; }
        }

        /* ===== Landscape phones ===== */
        @media (max-height: 500px) and (orientation: landscape) {
            main { padding: 16px 20px 24px; }
            .page-head { margin-bottom: 16px; }
            .page-head h1 { font-size: 20px; }
            .page-head p { display: none; }
            .section { padding: 14px 16px; margin-bottom: 12px; }
            .section-head { margin-bottom: 12px; padding-bottom: 10px; }
            .input-row { margin-bottom: 10px; }
        }

        /* ===== Reduce motion ===== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>

    <!-- ===== Top bar ===== -->
    <header class="topbar">
        <div class="inner">
            <a href="#" class="brand">
                <span class="dot"></span>
                P&L
                <small>Calculator</small>
            </a>
            <div class="topbar-right">
                <span class="meta">Live</span>
                <button
                    class="theme-toggle"
                    id="themeToggle"
                    type="button"
                    aria-label="Toggle color theme"
                    title="Toggle theme">
                    <!-- Sun icon (shown when in dark mode) -->
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                    </svg>
                    <!-- Moon icon (shown when in light mode) -->
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="page-head">
            <div class="eyebrow">Position &amp; Profit</div>
            <h1>P&L Calculator</h1>
            <p>Enter any two values in each section. The rest are computed automatically.</p>
        </div>

        <!-- ===== PHASE 1: BASE DATA ===== -->
        <section class="section" id="baseSection">
            <div class="section-head">
                <h2>Current Position <span class="status-dot"></span></h2>
                <span class="step">Step 01</span>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="qty">Qty</label>
                    <div class="input-wrapper">
                        <input type="number" id="qty" inputmode="decimal" placeholder="0" autocomplete="off">
                    </div>
                </div>
                <div class="input-group">
                    <label for="avgRate">Avg Rate</label>
                    <div class="input-wrapper">
                        <input type="number" id="avgRate" inputmode="decimal" placeholder="0.00" autocomplete="off">
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label for="invAmt">Inv. Amount (Value)</label>
                <div class="input-wrapper">
                    <input type="number" id="invAmt" inputmode="decimal" placeholder="0.00" autocomplete="off">
                    <span class="suffix">CUR</span>
                </div>
            </div>
        </section>

        <!-- ===== PHASE 2: PROJECTION ===== -->
        <section class="section disabled-section" id="projSection">
            <div class="section-head">
                <h2>Target &amp; Profit <span class="status-dot"></span></h2>
                <span class="step">Step 02</span>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="pctIncrease">Profit %</label>
                    <div class="input-wrapper">
                        <input type="number" id="pctIncrease" inputmode="decimal" placeholder="0.00" autocomplete="off">
                        <span class="suffix">%</span>
                    </div>
                </div>
                <div class="input-group">
                    <label for="newRate">New Rate</label>
                    <div class="input-wrapper">
                        <input type="number" id="newRate" inputmode="decimal" placeholder="0.00" autocomplete="off">
                    </div>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="expAmt">Exp. Amount</label>
                    <div class="input-wrapper">
                        <input type="number" id="expAmt" inputmode="decimal" placeholder="0.00" autocomplete="off">
                    </div>
                </div>
                <div class="input-group">
                    <label for="profitEarned">Profit Earned</label>
                    <div class="input-wrapper">
                        <input type="text" id="profitEarned" readonly placeholder="0.00">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="accent-bar"></div>
        Built to help. Powered by your innovative ideas.
    </footer>

    <script>
        // ===== Theme toggle with persistence =====
        // Dark mode is the default. The toggle lets the user switch to light.
        // If the user has previously chosen a theme, that choice is restored.
        (function initTheme() {
            const STORAGE_KEY = 'ic-theme';
            const root = document.documentElement; // <html> — vars cascade down to body
            // The HTML already defaults to dark via :root. Restore a saved preference if any.
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored === 'light' || stored === 'dark') {
                    root.setAttribute('data-theme', stored);
                }
            } catch (e) {}

            document.getElementById('themeToggle').addEventListener('click', function () {
                const current = root.getAttribute('data-theme') || 'dark';
                const next = current === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-theme', next);
                try { localStorage.setItem(STORAGE_KEY, next); } catch (e) {}
                // Update browser UI chrome color
                const tc = next === 'dark' ? '#0d1117' : '#f8f9fa';
                let m = document.querySelector('meta[name="theme-color"]:not([media])');
                if (!m) {
                    m = document.createElement('meta');
                    m.setAttribute('name','theme-color');
                    document.head.appendChild(m);
                }
                m.setAttribute('content', tc);
            });
        })();

        // ===== Calculator logic (unchanged) =====
        const baseInputs = {
            qty: document.getElementById('qty'),
            avgRate: document.getElementById('avgRate'),
            invAmt: document.getElementById('invAmt')
        };

        const projInputs = {
            pctIncrease: document.getElementById('pctIncrease'),
            newRate: document.getElementById('newRate'),
            expAmt: document.getElementById('expAmt'),
            profitEarned: document.getElementById('profitEarned')
        };

        const projSection = document.getElementById('projSection');
        const baseSection = document.getElementById('baseSection');
        let isCalculating = false;

        function getVal(input) {
            const v = parseFloat(input.value);
            return isNaN(v) ? null : v;
        }

        function setVal(input, val) {
            if (val === null || isNaN(val)) {
                input.value = '';
                return;
            }
            const formatted = parseFloat(val.toFixed(2));
            input.value = formatted;
        }

        function handleBaseCalculation(sourceId) {
            if (isCalculating) return;
            const q = getVal(baseInputs.qty);
            const r = getVal(baseInputs.avgRate);
            const a = getVal(baseInputs.invAmt);

            let baseValid = false;

            if (sourceId !== 'invAmt' && q !== null && r !== null) {
                isCalculating = true;
                setVal(baseInputs.invAmt, q * r);
                isCalculating = false;
                baseValid = true;
            }
            else if (sourceId !== 'avgRate' && q !== null && a !== null && q !== 0) {
                isCalculating = true;
                setVal(baseInputs.avgRate, a / q);
                isCalculating = false;
                baseValid = true;
            }
            else if (sourceId !== 'qty' && r !== null && a !== null && r !== 0) {
                isCalculating = true;
                setVal(baseInputs.qty, a / r);
                isCalculating = false;
                baseValid = true;
            }

            // Re-read Inv Amount AFTER the auto-fill above, so Phase 2 unlock
            // uses the up-to-date value (the original artifact captured `a`
            // before the auto-fill and left Phase 2 locked until the user
            // manually re-typed Inv Amount).
            const currentA = getVal(baseInputs.invAmt);

            if (q !== null && r !== null && currentA !== null && q > 0 && r > 0) {
                projSection.classList.remove('disabled-section');
                baseSection.classList.add('active');

                const currentExp = getVal(projInputs.expAmt);
                if(currentExp !== null) {
                    isCalculating = true;
                    setVal(projInputs.profitEarned, currentExp - currentA);
                    isCalculating = false;
                }
            } else {
                projSection.classList.add('disabled-section');
                baseSection.classList.remove('active');
                if(!isCalculating) clearProjection();
            }
        }

        function handleProjectionCalculation(sourceId) {
            if (projSection.classList.contains('disabled-section')) return;
            if (isCalculating) return;

            const q = getVal(baseInputs.qty);
            const baseR = getVal(baseInputs.avgRate);
            const baseA = getVal(baseInputs.invAmt);

            if (q === null || baseR === null || baseA === null) return;

            const p = getVal(projInputs.pctIncrease);
            const newR = getVal(projInputs.newRate);
            const expA = getVal(projInputs.expAmt);

            isCalculating = true;

            if (sourceId === 'pctIncrease' && p !== null) {
                const calculatedRate = baseR * (1 + (p / 100));
                const calculatedExpAmt = calculatedRate * q;
                setVal(projInputs.newRate, calculatedRate);
                setVal(projInputs.expAmt, calculatedExpAmt);
                setVal(projInputs.profitEarned, calculatedExpAmt - baseA);
            }
            else if (sourceId === 'newRate' && newR !== null) {
                const calculatedPct = ((newR - baseR) / baseR) * 100;
                const calculatedExpAmt = newR * q;
                setVal(projInputs.pctIncrease, calculatedPct);
                setVal(projInputs.expAmt, calculatedExpAmt);
                setVal(projInputs.profitEarned, calculatedExpAmt - baseA);
            }
            else if (sourceId === 'expAmt' && expA !== null) {
                const calculatedRate = expA / q;
                const calculatedPct = ((calculatedRate - baseR) / baseR) * 100;
                setVal(projInputs.newRate, calculatedRate);
                setVal(projInputs.pctIncrease, calculatedPct);
                setVal(projInputs.profitEarned, expA - baseA);
            }

            isCalculating = false;
        }

        function clearProjection() {
            projInputs.pctIncrease.value = '';
            projInputs.newRate.value = '';
            projInputs.expAmt.value = '';
            projInputs.profitEarned.value = '';
        }

        Object.keys(baseInputs).forEach(key => {
            baseInputs[key].addEventListener('input', () => handleBaseCalculation(key));
        });

        Object.keys(projInputs).forEach(key => {
            if(key !== 'profitEarned') {
                projInputs[key].addEventListener('input', () => handleProjectionCalculation(key));
            }
        });
    </script>

</body>
</html>
